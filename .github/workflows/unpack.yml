name: Dézipper le backend
on:
  push:
    paths: ["SSVLasy-FD-backend.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dézipper l'archive
        run: |
          test -f SSVLasy-FD-backend.zip || exit 0
          unzip -o SSVLasy-FD-backend.zip -d .
          rm SSVLasy-FD-backend.zip
      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Dézippe le backend à la racine"
          git push
