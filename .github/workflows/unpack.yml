name: Dézipper les archives

on:
  push:
    paths: ["*.zip"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dézipper toutes les archives à la racine (sans toucher aux workflows)
        run: |
          shopt -s nullglob
          archives=(*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "Aucune archive à la racine, rien à faire"
            exit 0
          fi
          for archive in "${archives[@]}"; do
            echo "Extraction de $archive"
            unzip -o "$archive" -d . -x ".github/workflows/*"
            rm "$archive"
          done

      - name: Enregistrer les fichiers extraits
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Dézippe les archives à la racine"
          git push
