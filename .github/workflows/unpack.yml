name: Dézipper le backend

on:
  push:
    paths: ["SSVLasy-FD-backend.zip"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dézipper l'archive (sans toucher aux workflows)
        run: |
          test -f SSVLasy-FD-backend.zip || { echo "Archive absente, rien à faire"; exit 0; }
          unzip -o SSVLasy-FD-backend.zip -d . -x ".github/workflows/*"
          rm SSVLasy-FD-backend.zip

      - name: Enregistrer les fichiers extraits
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Dézippe le backend à la racine"
          git push
