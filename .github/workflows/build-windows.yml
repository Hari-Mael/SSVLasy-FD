name: Construire le .exe Windows

on:
  push:
    branches: [main]
    paths: ["scripts/**", "*.tscn", "project.godot", "Sahavola.csproj", "export_presets.cfg"]
  workflow_dispatch:

jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Télécharger Godot 4.3 Mono et les modèles d'export
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot-builds/releases/download/4.3-stable"
          Invoke-WebRequest "$base/Godot_v4.3-stable_mono_win64.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath C:\godot
          Invoke-WebRequest "$base/Godot_v4.3-stable_mono_export_templates.tpz" -OutFile templates.zip
          Expand-Archive templates.zip -DestinationPath C:\tpl
          $source = (Get-ChildItem C:\tpl -Recurse -Filter "windows_release_x86_64*" | Select-Object -First 1).Directory
          $dest = "$env:APPDATA\Godot\export_templates\4.3.stable.mono"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$source\*" $dest -Recurse -Force

      - name: Compiler le C#
        run: dotnet build Sahavola.sln --configuration Release

      - name: Exporter le .exe
        shell: pwsh
        run: |
          $godot = (Get-ChildItem C:\godot -Recurse -Filter "Godot_v4.3-stable_mono_win64_console.exe" | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $godot --headless --path . --export-release "Windows Desktop" build/Sahavola.exe
          if (-not (Test-Path build/Sahavola.exe)) { throw "L'export n'a pas produit Sahavola.exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: sahavola-windows
          path: build/
